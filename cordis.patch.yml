# Runtime mounts and the ssh host store.
# Remote shell routing is opt-in: see examples/cordis.remote-shell.yml.
- id: fs-sandbox
  disabled: true
- insert:
    - id: remote-workspace
      name: dsh-remote-workstation
      config:
        storePath: ~/.dsh/remote-workspaces.json
        hostsPath: ~/.dsh/remote-workspaces-hosts.json
        sshHostsPath: ~/.dsh/dsh-ssh.json
        remoteReadOnly: false
        watchIntervalMs: 2000
        connectTimeoutMs: 15000
